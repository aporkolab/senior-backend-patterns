version: 2
updates:
  - package-ecosystem: maven
    directories:
      - "/"
      - "/demo-app/*"
    schedule:
      interval: monthly
    groups:
      maven:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
